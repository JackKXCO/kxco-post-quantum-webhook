version: 2

# https://docs.socket.dev/docs/socket-yml

issues:
  cve:
    action: error
  malware:
    action: error
  protestware:
    action: error
  new-author:
    action: warn
  install-scripts:
    action: warn
  telemetry:
    action: warn

# kxco-post-quantum — peer dep, maintained by this organisation.
# @noble/post-quantum — no transitive deps. NOT independently audited: self-audited
# by its maintainer. hashes was audited by Cure53 in Jan 2022,
# curves and ciphers by Cure53 in Sep 2024. None covered post-quantum.
ignore:
  - "kxco-post-quantum"
  - "@noble/post-quantum"
